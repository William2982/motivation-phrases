<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <!-- Firebase Storage -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-storage-compat.js"></script>
    <!-- Firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>

    <link rel="shortcut icon" href="assets/logo_phrases.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/firebase.js"></script>
    <script src="js/login.js" defer></script>
</head>

<body>
    <section id="login">
        <h2>Iniciar Sesión</h2>
        <form id="form-login">
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" maxlength="50" required>

            <label for="pass">Contraseña:</label>
            <input type="password" id="pass" name="pass" placeholder="Ingresa tu contraseña" maxlength="50" required>

            <button type="submit" class="btn-submit">Aceptar</button>
            <button type="button" class="btn-cancelar">Regresar</button>
        </form>
    </section>
</body>

</html>
